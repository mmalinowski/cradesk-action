name: 'CRA readiness report'
description: 'Turns a CycloneDX or SPDX SBOM into a Cyber Resilience Act readiness report in your job summary.'
author: 'CRA Desk'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  sbom-path:
    description: >-
      Path to a CycloneDX or SPDX JSON SBOM. Accepts a comma-separated list and one `*` in the final segment (e.g. `build/*.cdx.json`). Without it the report explains how to generate one.

    required: false
  config-path:
    description: >-
      Path to the CRA Desk config that answers the classifier questions and the checklist items CI cannot know.

    required: false
    default: 'cradesk.yml'
  comment:
    description: 'Post the report as a pull-request comment when a token is available.'
    required: false
    default: 'true'
  github-token:
    description: >-
      Token used only to post the pull-request comment. Needs `pull-requests: write`. Omit it and the report goes to the job summary only.

    required: false
  token:
    description: >-
      CRA Desk ingest token from your panel's Tokens page. Presence of this input is what turns on the upload step; omit it and the action only ever produces a report.

    required: false
  api-url:
    description: >-
      Base URL of your CRA Desk panel (e.g. https://cradesk.cloudsoft.com.pl). No default yet - without it, upload is skipped and the report says so.

    required: false
  product-id:
    description: 'Product ID from the panel. Required for upload to succeed once a token is set.'
    required: false
  product-version:
    description: 'Label for this upload (e.g. a release tag). Optional - shown in the product''s SBOM history.'
    required: false

runs:
  using: 'node24'
  main: 'dist/index.cjs'
